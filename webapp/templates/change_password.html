<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Смена пароля — Print Management v. 02</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <h1>Смена пароля</h1>
  {% if forced %}
  <div class="flash flash-err">
    Вам нужно сменить временный пароль перед тем, как продолжить работу с системой.
  </div>
  {% endif %}
  {% if error %}
  <div class="login-error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/change-password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Текущий пароль</label>
    <input type="password" name="current_password" autofocus required>
    <label>Новый пароль (минимум {{ min_length }} символов)</label>
    <input type="password" name="new_password" minlength="{{ min_length }}" required>
    <label>Повторите новый пароль</label>
    <input type="password" name="new_password_confirm" minlength="{{ min_length }}" required>
    <button type="submit">Сменить пароль</button>
  </form>
  <p style="font-size:12px; color:#6b7280; margin-top:16px;">
    После смены пароля все активные сессии этой учётной записи (включая текущую)
    будут завершены — потребуется войти заново.
  </p>
</div>
</body>
</html>
