{% extends "base.html" %}
{% block content %}
<h1>Отчёт по принтерам</h1>

<form class="filters" method="get">
  <div><label>С</label><input type="date" name="date_from" value="{{ date_from }}"></div>
  <div><label>По</label><input type="date" name="date_to" value="{{ date_to }}"></div>
  <button type="submit">Применить</button>
</form>

<div class="chart-wrap">
  <canvas id="chart" height="90"></canvas>
</div>

<table>
  <tr><th>Принтер / очередь</th><th>Заданий</th><th>Страниц</th><th>Стоимость ({{ currency }})</th><th></th></tr>
  {% for r in rows %}
  <tr>
    <td>{{ r.printer_name }}</td>
    <td>{{ r.jobs }}</td>
    <td>{{ r.pages }}</td>
    <td>{{ "%.2f"|format(r.cost) }}</td>
    <td><a href="/print-jobs?printer_name={{ r.printer_name | urlencode }}&date_from={{ date_from }}&date_to={{ date_to }}">журнал</a></td>
  </tr>
  {% else %}
  <tr><td colspan="5">Нет данных за выбранный период</td></tr>
  {% endfor %}
</table>

<script>
const labels = {{ rows | map(attribute="printer_name") | list | tojson }};
const pages = {{ rows | map(attribute="pages") | list | tojson }};
new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: { labels: labels, datasets: [{ label: 'Страниц', data: pages, backgroundColor: '#059669' }] },
  options: { responsive: true, plugins: { legend: { display: false } } }
});
</script>
{% endblock %}
