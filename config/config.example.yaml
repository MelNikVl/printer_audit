# Скопируйте этот файл в config/config.yaml и отредактируйте под конкретный объект.
# config.yaml в .gitignore не обязателен, но именно этот файл отличается на каждой из 4 площадок.

# Уникальный код площадки — попадает в каждую запись print_jobs.site_code.
# Нужен уже сейчас, чтобы в будущем можно было безболезненно объединить БД всех 4 объектов
# в одну центральную (см. docs/MULTISITE_ARCHITECTURE.md, docs/ROADMAP.md).
site_code: "ALMATY-HQ"

# Имя ЭТОГО Windows Print Server — по умолчанию берётся реальное имя
# компьютера (socket.gethostname()), эту строку можно не трогать вообще,
# если у вас один сервер на площадку. Используется только для локальной
# авто-регистрации Site+PrintServer В СВОЕЙ ЖЕ БД (см. printaudit/sites.py) —
# это НЕ то же самое, что AGENT_SITE_UUID/AGENT_PRINT_SERVER_UUID в .env,
# которыми агент представляется ЦЕНТРАЛЬНОМУ серверу.
# server_name: "PRINTSRV01"

db:
  # SQLite (по умолчанию, для пилота) — путь относительно корня репозитория:
  url: "sqlite:///./data/print_audit.db"
  # PostgreSQL (если уже есть сервер БД):
  # url: "postgresql+psycopg2://printaudit:PASSWORD@pg-host:5432/printaudit"

paths:
  users_departments_csv: "config/users_departments.csv"
  log_dir: "logs"

collector:
  log_name: "Microsoft-Windows-PrintService/Operational"
  event_id: 307
  poll_interval_minutes: 2
  max_events_per_run: 5000

  # !!! ВАЖНО — ОБЯЗАТЕЛЬНО ОТКАЛИБРОВАТЬ ПЕРЕД ПРОДАКШЕНОМ !!!
  # Индексы полей внутри Event ID 307 (свойство .Properties[N].Value) не задокументированы
  # Microsoft официально и могут отличаться между Windows Server 2016/2019/2022 и версией
  # драйвера принтера (v3/v4). Значения ниже — ТИПИЧНЫЕ, но НЕ гарантированные.
  # Порядок действий: распечатать тестовый документ -> запустить
  # collector/calibrate_event_fields.ps1 -> сверить индексы -> поправить значения ниже.
  #
  # Подтверждено на практике: на одном из реальных серверов total_pages оказался
  # в Properties[7], а НЕ в Properties[8] — то есть даже "типичные" значения ниже
  # могут не подойти вашему серверу. Это не повод один раз поправить число в этом
  # файле и забыть — калибровку нужно сделать на каждом объекте отдельно
  # (см. docs/ADMIN_GUIDE.md, раздел 3). Если индекс указан неверно, сборщик
  # теперь явно пишет в лог "field_map.<поле>=N вне диапазона" вместо того, чтобы
  # тихо подставлять 0/пустое значение.
  field_map:
    job_id: 0
    document_name: 1
    user_name: 2
    printer_name: 4
    total_pages: 8
    # Необязательные поля — добавляйте ТОЛЬКО если реально нашли и проверили
    # соответствующий индекс на своём сервере (см. calibrate_event_fields.ps1
    # и docs/MULTISITE_ARCHITECTURE.md про total_pages/копии). Если поле не
    # указано здесь, коллектор оставляет соответствующую колонку NULL, а не
    # выдумывает значение:
    # source_computer: 3
    # copies: 9
    # pages_per_copy: 10

# Только для APP_MODE=agent (см. .env.example) — параметры отправки в центр.
# Секрет агента (AGENT_TOKEN) сюда НЕ входит — он живёт только в .env.
agent:
  max_batch_size: 500
  http_timeout_seconds: 30
  # Интервал не используется кодом напрямую — это просто подсказка для
  # -IntervalMinutes при регистрации задачи (см. deploy/register_agent_sync_task.ps1).
  sync_interval_minutes: 2

currency: "KZT"
# Тариф по умолчанию, если для принтера нет более конкретного правила в price_list (Ч/Б)
default_price_per_page_bw: 8
# Тариф по умолчанию для принтеров/очередей, чьё имя матчится под правило is_color в price_list
default_price_per_page_color: 40

# Имя документа (print_jobs.document_name) может быть чувствительным
# ("Зарплата_Иванов.xlsx"). Варианты:
#   full   — хранить как есть (поведение по умолчанию, для обратной совместимости)
#   masked — хранить только расширение файла ("•••.docx"), само имя скрыто
#   none   — не хранить вообще
# Влияет только на НОВЫЕ задания печати с момента изменения настройки.
document_name_policy: "full"
